<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSSB RSS Feed</title>
</head>
<body style="font-family:monospace; white-space:pre-wrap;">
<script>
(async () => {
  const SHEET_ID = "1t_my2HdNcRqoLrWk1LJQLbZrMLvLMOtqKeZfQyRiiNE";
  const POSTS_SHEET = "MSSB_Post";

  try {
    const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${POSTS_SHEET}`);
    const data = await res.json();

    const rssItems = data.map(post => `
      <item>
        <title><![CDATA[${post.Title || ''}]]></title>
        <link>${post.Link || 'https://maharashtrasaralsevabharti.github.io/mssb/'}</link>
        <description><![CDATA[${post.Description || ''}]]></description>
        <pubDate>${new Date().toUTCString()}</pubDate>
        <guid>${post.Link || post.Title}</guid>
      </item>`).join("");

    const rssFeed = `<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
  <channel>
    <title>Maharashtra Saral Seva Bharti</title>
    <link>https://maharashtrasaralsevabharti.github.io/mssb/</link>
    <description>Latest Government Jobs, Schemes, and Updates in Marathi.</description>
    <language>mr</language>
    ${rssItems}
  </channel>
</rss>`;

    document.body.textContent = rssFeed;
  } catch (err) {
    console.error(err);
    document.body.textContent = "⚠️ RSS Feed तयार करण्यात त्रुटी आली.";
  }
})();
</script>
</body>
</html>

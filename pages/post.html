<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पोस्ट माहिती - महाराष्ट्र सरळ सेवा भरती</title>
  <meta name="description" content="ताजी सरकारी भरती, योजना आणि अपडेट्स - Maharashtra Saral Seva Bharti">
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: #f9f9f9;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }

    .post-wrapper {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .post-header {
      text-align: center;
      padding: 25px 15px;
      background: linear-gradient(135deg, #007bff, #00bcd4);
      color: #fff;
    }

    .post-header h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .meta {
      font-size: 14px;
      color: #e0e0e0;
    }

    .post-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }

    .post-content {
      padding: 25px;
      line-height: 1.8;
      color: #333;
      font-size: 17px;
    }

    .post-content p {
      margin-bottom: 15px;
    }

    .share-section {
      text-align: center;
      border-top: 1px solid #ddd;
      padding: 20px;
      background: #f6f6f6;
    }

    .share-section h3 {
      margin-bottom: 10px;
    }

    .share-icons a {
      display: inline-block;
      margin: 0 8px;
      text-decoration: none;
      font-size: 24px;
    }

    .share-icons a:hover {
      transform: scale(1.1);
    }

    .back-link {
      display: inline-block;
      margin: 20px;
      text-decoration: none;
      color: #007bff;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      background: #fafafa;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="post-wrapper">
    <div id="post-content">
      <p style="padding:30px;text-align:center;">लोड होत आहे...</p>
    </div>
  </div>

  <footer>
    © 2025 Maharashtra Saral Seva Bharti | सर्व हक्क राखीव.
  </footer>

  <script src="../script.js"></script>
  <script>
    async function loadSinglePost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id");
      const container = document.getElementById("post-content");

      if (!postId) {
        container.innerHTML = "<p>⚠️ पोस्ट सापडली नाही.</p>";
        return;
      }

      try {
        const response = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${POSTS_SHEET}`);
        const data = await response.json();
        const post = data.find(p => p.ID === postId);

        if (!post) {
          container.innerHTML = "<p>⚠️ ही पोस्ट उपलब्ध नाही.</p>";
          return;
        }

        const postURL = window.location.href;

        container.innerHTML = `
          <div class="post-header">
            <h1>${post.Title}</h1>
            <div class="meta">📅 ${post.Date || ""} | 🏷️ ${post.Category || ""}</div>
          </div>
          <img src="${post.Image || '../default.jpg'}" class="post-image" alt="${post.Title}">
          <div class="post-content">${post.Content || post.Description || ""}</div>

          <div class="share-section">
            <h3>📢 शेअर करा</h3>
            <div class="share-icons">
              <a href="https://wa.me/?text=${encodeURIComponent(post.Title + ' - ' + postURL)}" target="_blank" title="WhatsApp">🟢</a>
              <a href="https://t.me/share/url?url=${encodeURIComponent(postURL)}&text=${encodeURIComponent(post.Title)}" target="_blank" title="Telegram">🔵</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(postURL)}" target="_blank" title="Facebook">🔷</a>
              <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(postURL)}&text=${encodeURIComponent(post.Title)}" target="_blank" title="Twitter">⚫</a>
            </div>
          </div>

          <a href="../index.html" class="back-link">⬅️ मुख्यपृष्ठावर परत जा</a>
        `;
      } catch (error) {
        console.error(error);
        container.innerHTML = "<p>⚠️ डेटा मिळवण्यात त्रुटी आली.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", loadSinglePost);
  </script>
</body>
</html>

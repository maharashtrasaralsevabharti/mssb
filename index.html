<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>महाराष्ट्र सरळ सेवा भरती</title>
  <link rel="stylesheet" href="style.css">
</head>
  <div class="typing-text"></div>
  <script>
const texts = [
  "सार्वजनिक भरती माहिती",
  "शैक्षणिक अपडेट्स",
  "शेतकरी योजना",
  "सरकारी योजना",
  "Job & Study Tips"
];

let count = 0;
let index = 0;
let currentText = '';
let letter = '';

function type() {
  if (count === texts.length) {
    count = 0;
  }
  currentText = texts[count];
  letter = currentText.slice(0, ++index);

  document.querySelector('.typing-text').textContent = letter;
  if (letter.length === currentText.length) {
    count++;
    index = 0;
    setTimeout(type, 1500);
  } else {
    setTimeout(type, 100);
  }
}

type();
</script>
<body>
  <header>
    <img src="images/logo.png" alt="Logo">
    <h1>महाराष्ट्र सरळ सेवा भरती</h1>
    <nav>
      <a href="#">मुख्यपृष्ठ</a>
      <a href="#">नोकरी भरती</a>
      <a href="#">सरकारी योजना</a>
      <a href="#">शेतकरी</a>
      <a href="#">शासन निर्णय</a>
      <a href="#">डाउनलोड PDF</a>
    </nav>
  </header>

  <section class="typing">
    <h2 id="changing-text">महाराष्ट्र सरळ सेवा भरती</h2>
  </section>

  <section class="posts">
    <h3>Popular Posts</h3>
    <div class="post-grid">
      <div class="post"><img src="images/police.jpg" alt=""><p>पोलीस भरती 2025</p></div>
      <div class="post"><img src="images/mpsc.jpg" alt=""><p>MPSC वेळापत्रक</p></div>
      <div class="post"><img src="images/solar.jpg" alt=""><p>शेतकरी सौर पंप योजना</p></div>
      <div class="post"><img src="images/pdf.jpg" alt=""><p>Download PDF फाईल्स</p></div>
    </div>
  </section>

  <section class="social">
    <a href="#" class="youtube">YouTube</a>
    <a href="#" class="facebook">Facebook</a>
    <a href="#" class="instagram">Instagram</a>
  </section>

  <footer>© 2025 Maharashtra Saral Seva Bharti | All Rights Reserved</footer>

  <script>
    const texts = ["महाराष्ट्र सरळ सेवा भरती", "सरकारी योजना", "नोकरी भरती", "शेतकरी अपडेट्स"];
    let i = 0;
    setInterval(() => {
      document.getElementById("changing-text").textContent = texts[i];
      i = (i + 1) % texts.length;
    }, 2000);
  </script>
</body>
</html>
